<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="theme-color" content="#050306" />
    <title>Rechtliche Informationen · PlanRunde</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #050306;
        color: #f7f1f5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 24px;
        background:
          radial-gradient(circle at 20% 0%, rgba(226, 130, 176, 0.12), transparent 34%),
          #050306;
      }

      main {
        width: min(620px, 100%);
        padding: clamp(28px, 7vw, 58px);
        border: 1px solid rgba(255, 255, 255, 0.11);
        border-radius: 22px;
        background: #0e0a0f;
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.35);
      }

      small {
        color: #e282b0;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 12px 0;
        font-size: clamp(2rem, 7vw, 3.6rem);
        letter-spacing: -0.06em;
      }

      p {
        color: #b9abb4;
        line-height: 1.65;
      }

      nav {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 28px;
      }

      a {
        min-height: 48px;
        display: grid;
        place-items: center;
        padding: 10px;
        color: #1a0c14;
        font-weight: 800;
        text-align: center;
        text-decoration: none;
        border-radius: 10px;
        background: #e282b0;
      }

      a:last-child {
        color: #e5eae6;
        border: 1px solid rgba(255, 255, 255, 0.13);
        background: rgba(255, 255, 255, 0.035);
      }

      @media (max-width: 520px) {
        nav {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <small>Kostenloses Hobbyprojekt</small>
      <h1>PlanRunde</h1>
      <p>
        Hier findest du die öffentlich bereitgestellten rechtlichen Informationen
        für die Discord Activity PlanRunde.
      </p>
      <nav aria-label="Rechtliche Informationen">
        <a href="./privacy/">Datenschutzerklärung</a>
        <a href="./terms/">Nutzungsbedingungen</a>
      </nav>
    </main>
  </body>
</html>
